[project]
name = "stock-compass"
version = "0.1.0"
description = "개인 매매 의사결정 보조 도구 (한국·미국 다요인 점수화)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Personal use only — not for redistribution" }
authors = [{ name = "Personal" }]

dependencies = [
  # 데이터
  "yfinance>=0.2.40",
  "pykrx>=1.0.45",
  "fredapi>=0.5.2",
  "opendartreader>=0.2.2",
  "pandas>=2.2",
  "numpy>=2.0",
  "pandas-market-calendars>=4.4",
  # LLM
  "anthropic>=0.40.0",
  # CLI / UI
  "typer>=0.12",
  "rich>=13.7",
  # HTTP / 검증
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38", "altair>=5.4"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "pytest-asyncio>=0.24",
  "vcrpy>=6.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
]

[project.scripts]
stock-compass = "stock_compass.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_compass"]

# ──────────────── Ruff ────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "N",   # naming
  "UP",  # pyupgrade
  "B",   # bugbear
  "A",   # builtins
  "C4",  # comprehensions
  "SIM", # simplify
  "PL",  # pylint
  "RUF", # ruff-specific
]
ignore = [
  "PLR0913", # too many arguments — factor 함수에서 흔함
  "PLR2004", # magic value — 점수 임계치 등
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

# ──────────────── mypy ────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "pykrx.*", "fredapi.*", "OpenDartReader.*", "pandas_market_calendars.*"]
ignore_missing_imports = true

# ──────────────── pytest ────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
  "integration: 실제 외부 API 호출 (CI에서 스킵)",
  "slow: 5초 이상 걸리는 테스트",
]
asyncio_mode = "auto"

# ──────────────── coverage ────────────────
[tool.coverage.run]
source = ["src/stock_compass"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
